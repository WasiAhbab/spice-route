spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/spice}
    username: ${DATABASE_USER:spice}
    password: ${DATABASE_PASSWORD:spice_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  max-http-request-header-size: 32KB
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  public-url: ${PUBLIC_URL:http://localhost:3000}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  secure-cookies: ${SECURE_COOKIES:false}
  ai-key: ${AI_API_KEY:}
  ai-model: ${AI_MODEL:gemini-3.5-flash-lite}
  ai-fallback-model: ${AI_FALLBACK_MODEL:gemini-3.5-flash}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
