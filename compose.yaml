services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: spice
      POSTGRES_USER: spice
      POSTGRES_PASSWORD: spice_local
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spice -d spice"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["spice_data:/var/lib/postgresql/data"]
volumes:
  spice_data:
